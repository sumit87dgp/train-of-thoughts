name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

# OIDC for Azure login (no long-lived client secret)
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test (ephemeral Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tot
          POSTGRES_USER: tot_owner
          POSTGRES_PASSWORD: tot_owner_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tot_owner -d tot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://tot_owner:tot_owner_dev@localhost:5432/tot?sslmode=disable
      DATABASE_URL_API: postgres://tot_api:tot_api_dev@localhost:5432/tot?sslmode=disable
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Run migrations
        run: |
          chmod +x tot-db/scripts/migrate.sh
          ./tot-db/scripts/migrate.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: tot-backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend tests
        working-directory: tot-backend
        run: pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: tot-frontend/.nvmrc
          cache: npm
          cache-dependency-path: tot-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: tot-frontend
        run: npm ci

      - name: Build frontend
        working-directory: tot-frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  deploy-api:
    name: Deploy API (App Service)
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy tot-backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: tot-backend

  deploy-web:
    name: Deploy frontend (Static Web Apps)
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: tot-frontend/.nvmrc
          cache: npm
          cache-dependency-path: tot-frontend/package-lock.json

      - name: Install and build
        working-directory: tot-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Pre-built in the step above; deploy dist root (not source with /src/main.jsx).
          app_location: tot-frontend/dist
          output_location: ""
          skip_app_build: true
